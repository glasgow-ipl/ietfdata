[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ietfdata"]

[project]
name            = "ietfdata"
version         = "0.9.1"
authors         = [{name = "Colin Perkins", email = "csp@csperkins.org"}]
description     = "Access the IETF Data Tracker and RFC Index"
readme          = "README.md"
license         = "BSD-2-Clause"

requires-python = '>=3.13'

dependencies = [
  "imapclient",
  "pandas",
  "pandas-stubs",
  "python-dateutil",
  "pydantic",
  "psycopg",
  "requests",
  "requests-cache",
  "mypy",
  "setuptools",
  "wheel",
  "twine",
  "keyring",
  "coverage",
  "types-six",
  "types-requests",
  "types-python-dateutil",
]

