[mypy]
python_version = 3.13
warn_no_return       = True
warn_redundant_casts = True
warn_return_any      = True
warn_unreachable     = True
warn_unused_configs  = True
warn_unused_ignores  = True
disallow_any_generics  = True
disallow_untyped_calls = True
disallow_untyped_defs  = True
mypy_path = stubs
check_untyped_defs = True
plugins = pydantic.mypy

# As of v4.3.0 the imapclient package is missing full type annotations.
# Running `stubgen -p imapclient -o stubs` generates stub, but they are
# incomplete, so we need this flag.
[mypy-imapclient.*]
ignore_errors = true

