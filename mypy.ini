[mypy]
python_version = 3.13
mypy_path = stubs
plugins   = pydantic.mypy
check_untyped_defs   = True
warn_no_return       = True
warn_redundant_casts = True
warn_return_any      = True
warn_unreachable     = True
warn_unused_configs  = True
warn_unused_ignores  = True
# The following should be enabled, but the code needs fixing first:
#   disallow_any_generics    = True
#   disallow_untyped_calls   = True
#   disallow_untyped_defs    = True
#   disallow_incomplete_defs = True

# As of v4.3.0 the imapclient package is missing full type annotations.
# Running `stubgen -p imapclient -o stubs` generates stub, but they are
# incomplete, so we need this flag.
[mypy-imapclient.*]
ignore_errors = true

